<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">BrandFleet by DJ — a browser control room</title>
  <desc id="desc">A stylized browser control room connects Coolify website deployments, workspace and mail. This illustration depicts the project, not live service status. Decorative motion stops when reduced motion is requested.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100b23"/><stop offset=".52" stop-color="#080b19"/><stop offset="1" stop-color="#170b29"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#9874ff"/><stop offset="1" stop-color="#ff46ce"/></linearGradient>
    <linearGradient id="headline"><stop stop-color="#6ffaff"/><stop offset="1" stop-color="#c7a5ff"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#933bcb" stop-opacity=".23"/><stop offset="1" stop-color="#933bcb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9b78db" stroke-opacity=".075"/></pattern>
    <clipPath id="frame"><path d="M22 1H1258L1279 22V458L1258 479H22L1 458V22Z"/></clipPath>
  </defs>
  <style>
    .orbit { transform-origin: 1020px 236px; animation: orbit 28s linear infinite; }
    .counter { transform-origin: 1020px 236px; animation: orbit 38s linear infinite reverse; }
    .trace { stroke-dasharray: 12 72; animation: trace 9s linear infinite; }
    .delayed { animation-delay: -4.5s; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes trace { to { stroke-dashoffset: -168; } }
    @media (prefers-reduced-motion: reduce) { .orbit,.counter,.trace { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#grid)"/>
    <ellipse cx="1040" cy="240" rx="320" ry="280" fill="url(#aura)"/>
    <path d="M0 403H690L733 360V111L774 70H1280" stroke="#2e264b" fill="none"/>
    <path d="M0 410H699L741 368V119L782 78H1280" stroke="url(#neon)" stroke-opacity=".23" fill="none"/>
    <path d="M744 480L916 352M876 480L972 352M1008 480L1028 352M1140 480L1084 352M1272 480L1140 352M804 396H1200M758 438H1258" fill="none" stroke="#773d9d" stroke-opacity=".22"/>
    <g font-family="system-ui, -apple-system, sans-serif">
      <path d="M50 49h26l8 8h-26Z" fill="#00f5ff"/>
      <text x="100" y="60" fill="#b7a7d2" font-family="monospace" font-size="15" letter-spacing="2.5">DARSHJME // SELF-HOSTED OPERATIONS</text>
      <text x="49" y="176" fill="#ff46ce" opacity=".14" font-weight="800" font-size="72" letter-spacing="-2">BrandFleet</text>
      <text x="52" y="173" fill="#f5efff" font-weight="800" font-size="72" letter-spacing="-2">BrandFleet</text>
      <text x="52" y="255" fill="url(#headline)" font-weight="800" font-size="72" letter-spacing="-2">by DJ.</text>
      <path d="M53 284H310L321 273H411" stroke="url(#neon)" stroke-width="2" fill="none"/>
      <text x="53" y="328" fill="#b8b5cf" font-size="24">Coolify deployments.</text>
      <text x="53" y="365" fill="#b8b5cf" font-size="24">Shared Debian services. One browser.</text>
      <text x="53" y="439" fill="#c6b4e1" font-family="monospace" font-size="14" letter-spacing="1.5">NODE.JS / PYTHON     CONTROL ROOM / REFERENCE</text>
    </g>
    <g fill="none">
      <path d="M785 110H1204L1225 131V296H806L785 275Z" fill="#100f24" stroke="url(#neon)" stroke-width="1.5"/>
      <path d="M785 151H1225" stroke="#47345f"/>
      <path d="M798 111H929M1224 182V252" stroke="#00f5ff" stroke-width="2"/>
      <path class="trace" d="M798 111H1198L1225 138V275" stroke="#ff46ce" stroke-width="2"/>
      <path d="M1005 296V322M860 322H1150M860 322V341M1005 322V341M1150 322V341" stroke="#594273" stroke-width="2"/>
      <path class="trace delayed" d="M1005 296V322H860V341M1005 322V341M1005 322H1150V341" stroke="#00f5ff" stroke-width="2"/>
      <path d="M809 182H1197V268H809Z" fill="#15142c" stroke="#675582"/>
      <path d="M833 209H855V237H833ZM864 209H886V237H864ZM895 209H917V237H895Z" fill="#00f5ff" fill-opacity=".08" stroke="#00f5ff" stroke-opacity=".75"/>
      <path d="M800 341H912L922 351V403H810L800 393Z" fill="#0d1225" stroke="#00f5ff" stroke-opacity=".5"/>
      <path d="M945 341H1057L1067 351V403H955L945 393Z" fill="#131027" stroke="#9874ff" stroke-opacity=".6"/>
      <path d="M1090 341H1202L1212 351V403H1100L1090 393Z" fill="#191026" stroke="#ff46ce" stroke-opacity=".5"/>
    </g>
    <g font-family="monospace">
      <path d="M809 130h10m6 0h10m6 0h10" stroke="#9874ff" stroke-width="3"/>
      <text x="879" y="135" fill="#d4c6ea" font-size="12" letter-spacing="1.5">DEPLOYMENT CONTROL ROOM</text>
      <text x="946" y="214" fill="#f5efff" font-size="18">COOLIFY</text>
      <text x="946" y="242" fill="#b8b5cf" font-size="14">Docker / Compose</text>
    </g>
    <g font-family="monospace" text-anchor="middle">
      <text x="861" y="366" fill="#8cfbff" font-size="12" letter-spacing="1">WEBSITES</text>
      <text x="861" y="388" fill="#b8b5cf" font-size="11">App workloads</text>
      <text x="1006" y="366" fill="#d4bbff" font-size="12" letter-spacing="1">WORKSPACE</text>
      <text x="1006" y="388" fill="#b8b5cf" font-size="11">Shared files</text>
      <text x="1151" y="366" fill="#ff9ee5" font-size="12" letter-spacing="1">MAIL</text>
      <text x="1151" y="388" fill="#b8b5cf" font-size="11">Debian services</text>
      <text x="1005" y="448" fill="#9b88b5" font-size="11" letter-spacing="2">OVERVIEW / INVENTORY / OPERATIONS</text>
    </g>
  </g>
  <path d="M22 1H1258L1279 22V458L1258 479H22L1 458V22Z" stroke="url(#neon)" stroke-opacity=".55" fill="none"/>
  <path d="M1 85V22L22 1H91M1189 479H1258L1279 458V395" stroke="#00f5ff" stroke-width="3" fill="none"/>
  <path d="M1190 1H1258L1279 22V69M1 411V458L22 479H91" stroke="#ff46ce" stroke-width="3" fill="none"/>
</svg>
