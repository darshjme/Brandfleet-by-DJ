    <rect x="858" y="92" width="585" height="48" rx="20" fill="#263e4a"/>
    <path d="M858 118h585v22H858Z" fill="#263e4a"/>
    <circle cx="887" cy="116" r="5" fill="#ffb099"/><circle cx="905" cy="116" r="5" fill="#edcc88"/><circle cx="923" cy="116" r="5" fill="#80d9bd"/>
    <text x="954" y="122" class="label">BRANDFLEET / DEPLOYMENT CONTROL ROOM</text>
    <rect x="885" y="168" width="260" height="197" rx="14" fill="#132730" stroke="#4d6a73"/>
    <circle cx="914" cy="199" r="5" fill="#83dfc5"/>
