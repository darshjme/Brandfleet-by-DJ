<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc">
  <title id="title">BrandFleet: Coolify on Debian and shared services</title>
  <desc id="desc">Website domains reach per-application Docker or Compose stacks through Traefik. The authenticated BrandFleet dashboard links to Coolify and reads live container inventory through a private controller. Persistent app data and a shared Debian LXC have separate backups. The Android pool is retained as recovery material, outside website uptime.</desc>
  <defs>
    <marker id="traffic-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="m0 0 10 5-10 5Z" fill="#f4c485"/></marker>
    <marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="m0 0 10 5-10 5Z" fill="#64dcc2"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f7fb;font-size:22px;font-weight:700}.body{fill:#adc4d1;font-size:18px}.small{fill:#91aebc;font-size:15px}.control{fill:none;stroke:#64dcc2;stroke-width:3;marker-end:url(#control-arrow)}.traffic{fill:none;stroke:#f4c485;stroke-width:3;marker-end:url(#traffic-arrow)}.data{fill:none;stroke:#98b5e8;stroke-width:3;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1560" height="1100" rx="24" fill="#101c29"/>
  <text x="60" y="65" fill="#f0f7fb" font-size="38" font-weight="700">BrandFleet / architecture</text>
  <text x="60" y="105" class="body">Coolify website hosting + shared Debian services · October 2026</text>
  <path d="M60 135h1440" stroke="#36515f"/>
  <rect x="360" y="170" width="1130" height="700" rx="22" fill="#142731" stroke="#648b99" stroke-width="2"/>
  <text x="390" y="208" class="title">Debian deployment VM on Proxmox</text>
  <text x="1210" y="208" class="small">Shared kernel and capacity</text>
  <rect x="70" y="246" width="230" height="110" rx="15" fill="#27363f" stroke="#68808b"/>
  <text x="94" y="285" class="title">Website domains</text>
  <text x="94" y="316" class="body">Visitors + DNS</text>
  <text x="94" y="340" class="small">One ingress address</text>
  <rect x="390" y="246" width="300" height="110" rx="15" fill="#3b3638" stroke="#b18c64"/>
  <text x="415" y="285" class="title">Traefik HTTPS ingress</text>
  <text x="415" y="316" class="body">Hostname-based routing</text>
  <text x="415" y="340" class="small">Trusted TLS at the public boundary</text>
  <path d="M300 301h90" class="traffic"/>
  <rect x="800" y="246" width="620" height="204" rx="17" fill="#1f3940" stroke="#66a99e"/>
  <text x="825" y="285" class="title">Per-application Docker / Compose</text>
  <text x="825" y="319" class="body">Static sites and Node apps · Stateful application stacks</text>
  <rect x="824" y="347" width="168" height="72" rx="10" fill="#25453f" stroke="#5da18d"/>
  <text x="844" y="377" fill="#edfbf6" font-size="18" font-weight="700">Web application</text>
  <text x="844" y="403" class="small">Current code + config</text>
  <rect x="1012" y="347" width="190" height="72" rx="10" fill="#273d4b" stroke="#7393b7"/>
  <text x="1032" y="377" fill="#edf5ff" font-size="18" font-weight="700">Database services</text>
  <text x="1032" y="403" class="small">Data-specific checks</text>
  <rect x="1222" y="347" width="172" height="72" rx="10" fill="#273d4b" stroke="#7393b7"/>
  <text x="1242" y="377" fill="#edf5ff" font-size="18" font-weight="700">Workers / cache</text>
  <text x="1242" y="403" class="small">Bounded resources</text>
  <path d="M690 301h110" class="traffic"/>
  <rect x="70" y="486" width="230" height="100" rx="15" fill="#203b3e" stroke="#5b9b95"/>
  <text x="94" y="525" class="title">Administrator</text>
  <text x="94" y="557" class="body">Browser over HTTPS</text>
  <rect x="390" y="486" width="300" height="100" rx="15" fill="#203b3e" stroke="#5b9b95"/>
  <text x="415" y="525" class="title">BrandFleet dashboard</text>
  <text x="415" y="557" class="body">Overview + management links</text>
  <path d="M300 536h90" class="control"/>
  <rect x="800" y="486" width="270" height="100" rx="15" fill="#203b3e" stroke="#5b9b95"/>
  <text x="825" y="525" class="title">Coolify console</text>
  <text x="825" y="557" class="body">Deployment ownership</text>
  <path d="M690 536h110" class="control"/>
  <path d="M935 486v-36" class="control"/>
  <rect x="1100" y="486" width="320" height="100" rx="15" fill="#273d4b" stroke="#7393b7"/>
  <text x="1125" y="525" class="title">Persistent app data</text>
  <text x="1125" y="557" class="body">Databases + files + volumes</text>
  <path d="M1260 450v36" class="data"/>
  <rect x="390" y="651" width="300" height="110" rx="15" fill="#203b3e" stroke="#5b9b95"/>
  <text x="415" y="690" class="title">Private Python controller</text>
  <text x="415" y="720" class="body">Current resource mappings</text>
  <text x="415" y="745" class="small">Container state + resource observations</text>
  <path d="M540 586v65" class="control"/>
  <path d="M690 706h65V340h45" class="control"/>
  <rect x="800" y="651" width="620" height="179" rx="17" fill="#273646" stroke="#7d95b1"/>
  <text x="825" y="691" class="title">Shared Debian LXC · Native services</text>
  <text x="825" y="726" class="body">Nextcloud: files, chat, calendar, contacts and boards</text>
  <text x="825" y="761" class="body">Postfix + Dovecot + filtering + DKIM + webmail</text>
  <text x="825" y="796" class="body">PocketBase · FreeResend · TURN · DNS management</text>
  <path d="M540 356v92h180v331h80" class="traffic"/>
  <text x="729" y="817" class="small">HTTPS</text>
  <path d="M1420 350h40v391h-40" class="control"/>
  <rect x="70" y="916" width="780" height="116" rx="17" fill="#1e2937" stroke="#6e8297" stroke-dasharray="8 6"/>
  <text x="95" y="955" class="title">Stopped Android recovery VM</text>
  <text x="95" y="988" class="body">Original device data and website sources · Outside website uptime</text>
  <text x="95" y="1013" class="small">Historical device control source remains available for an independent lab</text>
  <rect x="1010" y="916" width="480" height="116" rx="17" fill="#273d4b" stroke="#7393b7"/>
  <text x="1035" y="955" class="title">Local / configured offhost backups</text>
  <text x="1035" y="988" class="body">Separate from Git source</text>
  <text x="1035" y="1013" class="small">Consistency + verification + restore scope</text>
  <path d="M1420 536h100v438h-30" class="data"/>
  <path d="M1260 830v86" class="data"/>
  <text x="60" y="1070" class="small">Container limits isolate budgets. The physical Proxmox host, Debian VM, ingress and storage remain common dependencies.</text>
</svg>
