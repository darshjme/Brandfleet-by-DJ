<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="500" viewBox="0 0 1560 500" role="img" aria-labelledby="title desc">
  <title id="title">BrandFleet by DJ</title>
  <desc id="desc">A browser control room for Coolify website deployments and shared Debian mail and workspace services. By Darshankumar Joshi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2a"/><stop offset="1" stop-color="#132b32"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73e8cb"/><stop offset="1" stop-color="#91bdf6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter>
    <style>text{font-family:Arial,Helvetica,sans-serif}.small{font-size:17px;letter-spacing:2.5px;font-weight:700}.body{font-size:22px;fill:#b9cbd3}.label{font-size:16px;fill:#c4d3dd;font-weight:700}.card-title{font-size:22px;fill:#f4fbfa;font-weight:700}</style>
  </defs>
  <rect width="1560" height="500" rx="24" fill="url(#bg)"/>
  <path d="M1110 0 1560 0 1560 500 1320 500Z" fill="#74e9d0" opacity=".035"/>
  <circle cx="1420" cy="50" r="280" fill="none" stroke="#64979c" stroke-opacity=".12"/>
  <circle cx="1420" cy="50" r="200" fill="none" stroke="#64979c" stroke-opacity=".12"/>
  <rect x="68" y="57" width="38" height="38" rx="11" fill="url(#accent)"/>
  <path d="M79 69h16v5H84v4h9v5h-9v6h-5Z" fill="#132935"/>
  <text x="124" y="84" class="small" fill="#87e6d0">YOUR BRANDS. ONE CONTROL ROOM.</text>
  <text x="68" y="192" fill="#f4fbfa" font-size="70" font-weight="700">BrandFleet <tspan fill="#86e2cc">by DJ</tspan></text>
  <text x="70" y="246" class="body">Website deployments. Shared Debian services.</text>
  <text x="70" y="280" class="body">Shared mail and workspace. One browser.</text>
  <path d="M70 322h490" stroke="#56717e" stroke-opacity=".55"/>
  <text x="70" y="360" font-size="19" fill="#eff7fa">By Darshankumar Joshi</text>
  <text x="70" y="397" font-size="15" fill="#97b0bf">Coolify on Debian · Per-app workloads · Persistent data</text>
